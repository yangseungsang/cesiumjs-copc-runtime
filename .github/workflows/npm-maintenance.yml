name: npm package maintenance

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Public package to maintain
        required: true
        type: choice
        options:
          - cesiumjs-copc
          - cesiumjs-copc-core
          - cesiumjs-copc-runtime
          - cesiumjs-copc-worker
          - cesiumjs-copc-analysis
      package_version:
        description: Exact published version to deprecate
        required: true
        default: "0.1.0"
        type: string
      deprecation_message:
        description: Message shown to npm users
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    name: Deprecate ${{ inputs.package_name }}@${{ inputs.package_version }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Validate maintenance request
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          DEPRECATION_MESSAGE: ${{ inputs.deprecation_message }}
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package_version must be an exact stable semantic version" >&2
            exit 1
          fi

          if [[ -z "${DEPRECATION_MESSAGE//[[:space:]]/}" ]]; then
            echo "deprecation_message must not be blank" >&2
            exit 1
          fi
      - name: Deprecate exact package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          DEPRECATION_MESSAGE: ${{ inputs.deprecation_message }}
        run: |
          package_spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          npm view "$package_spec" version
          npm deprecate "$package_spec" "$DEPRECATION_MESSAGE"
          npm view "$package_spec" deprecated
